<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support | Agent Assist PoC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Customer View -->
        <div class="view-panel customer-panel">
            <div class="panel-header">
                <h2><span class="material-symbols-outlined">smartphone</span> Customer View</h2>
                <p>Simulate a customer sending a message</p>
            </div>
            
            <div class="chat-container customer-chat" id="customer-chat-window">
                <div class="chat-message agent">
                    <div class="avatar">A</div>
                    <div class="message-bubble">Hello! How can I help you today?</div>
                </div>
            </div>

            <div class="input-area">
                <textarea id="customer-input" placeholder="Type a message... (e.g. 'I am so frustrated with this service!')" rows="3"></textarea>
                <button id="send-btn" class="primary-btn">
                    <span class="material-symbols-outlined">send</span> Send
                </button>
            </div>
        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Agent View -->
        <div class="view-panel agent-panel">
            <div class="panel-header">
                <h2><span class="material-symbols-outlined">support_agent</span> Agent View</h2>
                <p>Real-time AI assistance</p>
            </div>
            
            <div class="chat-container agent-chat" id="agent-chat-window">
                <div class="chat-message agent">
                    <div class="avatar">A</div>
                    <div class="message-bubble">Hello! How can I help you today?</div>
                </div>
            </div>

            <!-- Agent Assist Module -->
            <div class="agent-assist-module">
                <div class="assist-header">
                    <h3><span class="material-symbols-outlined">psychiatry</span> AI Agent Assist</h3>
                    <div id="status-indicator" class="status-indicator idle"></div>
                </div>
                <div class="assist-content" id="assist-content">
                    <div class="empty-state">
                        <span class="material-symbols-outlined empty-icon">forum</span>
                        <p>Waiting for customer message...</p>
                    </div>
                </div>
                
                <!-- Chat Temperature UI -->
                <div class="temperature-container">
                    <div class="temp-header">
                        <span><span class="material-symbols-outlined" style="font-size: 16px; vertical-align: bottom;">device_thermostat</span> Chat Health</span>
                        <span id="temp-value">100%</span>
                    </div>
                    <div class="temp-bar-bg">
                        <div class="temp-bar-fill" id="temp-bar" style="width: 100%; background: var(--joy);"></div>
                    </div>
                </div>
            </div>
            
            <div class="input-area">
                <textarea id="agent-input" placeholder="Type a reply to de-escalate... (e.g. 'I understand, let me fix this.')" rows="3"></textarea>
                <button id="agent-send-btn" class="secondary-btn">
                    <span class="material-symbols-outlined">send</span> Reply
                </button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
